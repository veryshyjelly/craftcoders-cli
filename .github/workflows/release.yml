name: Validate and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.94.0'
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: Native ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin_arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: darwin_amd64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - platform: linux_arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - platform: linux_amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag and packaging helpers
        run: |
          python3 scripts/release.py version --tag "$RELEASE_TAG"
          python3 -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Install verified Rust toolchain
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target "$BUILD_TARGET"
          rustup override set "$RUST_VERSION"
      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Native tests and release build
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$BUILD_TARGET"
          cargo build --locked --release --target "$BUILD_TARGET"
      - name: Native version smoke and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/release.py package --tag "$RELEASE_TAG" --binary "target/$BUILD_TARGET/release/craftcoders" --platform "$BUILD_PLATFORM" --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  integrity:
    name: Verify complete release assets
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Require and validate all four archives
        run: |
          python3 scripts/release.py manifest --tag "$RELEASE_TAG" --directory dist
          python3 scripts/release.py validate --tag "$RELEASE_TAG" --directory dist
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish complete draft
    needs: [build, integrity]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.repository == 'veryshyjelly/craftcoders-cli'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: dist
      - name: Upload draft, verify remote assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --directory dist
